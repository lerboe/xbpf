[package]
name = "xbpf-macros"
version = "0.0.4"
edition = "2024"
license = "MIT"
authors = ["lerboe <mail@laurinbrandner.ch>"]
repository = "https://github.com/lerboe/xbpf"
readme = "README.md"
description = "Procedural macros for xbpf"
categories = ["os", "os::linux-apis", "network-programming"]
keywords = ["ebpf", "bpf", "libbpf", "linux"]

[lib]
proc-macro = true
test = false
doctest = false

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full"] }
