[package]
name = "xbpf"
version = "0.0.6"
edition = "2024"
license = "MIT"
authors = ["lerboe <mail@laurinbrandner.ch>"]
repository = "https://github.com/lerboe/xbpf"
readme = "README.md"
description = "An ergonomic and light-weight eBPF library"
categories = ["os", "os::linux-apis", "network-programming"]
keywords = ["ebpf", "bpf", "libbpf", "linux"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
glob = { version = "0.3.4", optional = true }
libbpf-cargo = "0.27.2"
libbpf-rs = "0.27.2"
tokio = { version = "1.53.2", features = ["sync"], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
xbpf-macros = { path = "../xbpf-macros", version = "0.0.4", optional = true }

[dev-dependencies]
temp-env = "0.3.6"
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = ["build", "tracing"]
build = ["dep:glob", "dep:tracing-subscriber"]
collections = ["dep:tokio"]
tracing = ["collections"]
test = ["dep:xbpf-macros"]
tracing-source-loc = []
